name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make bash
      - name: Validate scaffold contract
        run: python3 scripts/validate_scaffold.py
      - name: Build and test
        run: make test
